<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>洛克 PVP HUD · 等服务</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
    body {
      display: grid; place-items: center; padding: 6px; box-sizing: border-box;
      font: 12px/1.6 "Microsoft YaHei", "Segoe UI", sans-serif; color: #2f2b24;
    }
    .card {
      width: min(100%, 1024px); padding: 14px 18px; border-radius: 10px;
      border: 1px solid rgba(112, 177, 218, 0.92);
      background: linear-gradient(135deg, rgba(214, 240, 252, 0.96), rgba(255, 248, 228, 0.9));
      box-shadow: 0 6px 18px rgba(28, 46, 60, 0.18);
    }
    h1 { margin: 0 0 6px; font-size: 14px; }
    p { margin: 4px 0; }
    code {
      display: inline-block; padding: 2px 6px; border-radius: 4px;
      background: rgba(47, 43, 36, 0.08); font-family: Consolas, monospace;
    }
    .hint { color: #716a5c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>模拟服务还没启动，悬浮 HUD 正在等它</h1>
    <p>在项目根目录执行任一条即可：</p>
    <p><code>scripts\start_hud_overlay.ps1</code>（会自动拉起服务）</p>
    <p><code>python -m lab.server --port 8766</code></p>
    <p class="hint">服务起来后本窗口每 2.5 秒自动重试，不需要手动刷新。网页版同样在 <code>http://127.0.0.1:8766/battle</code>。</p>
  </div>
</body>
</html>
