<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full Battle HUD</title>
  <style>
    :root {
      color-scheme: light;
      --panel: rgba(214, 240, 252, 0.94);
      --panel-strong: rgba(235, 249, 255, 0.96);
      --line: rgba(112, 177, 218, 0.78);
      --blue: #3e8fc3;
      --cream: #fff8e4;
      --brown: #8a6f43;
      --text: #2f2b24;
      --muted: #716a5c;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 8px;
    }

    .hud {
      width: min(100%, 1024px);
      height: 224px;
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(112, 177, 218, 0.92);
      border-radius: 10px;
      background:
        linear-gradient(135deg, rgba(207, 236, 250, 0.98), rgba(235, 249, 255, 0.94)),
        var(--panel);
      box-shadow: 0 14px 34px rgba(50, 112, 154, 0.22);
      cursor: move;
    }

    .region {
      position: relative;
      display: grid;
      grid-template-columns: 126px 150px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 0;
      padding: 8px 14px 8px 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(197, 232, 249, 0.96), rgba(235, 249, 255, 0.9) 44%, rgba(255, 248, 228, 0.54)),
        var(--panel-strong);
    }

    .region::before {
      content: "";
      position: absolute;
      inset: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.72);
      pointer-events: none;
    }

    .avatar-stack {
      position: relative;
      z-index: 1;
      width: 112px;
      display: grid;
      justify-items: center;
      gap: 5px;
    }

    .avatar-box {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 248, 228, 0.96);
      border-radius: 10px;
      background:
        radial-gradient(circle at 42% 28%, rgba(255, 255, 255, 0.62), transparent 36%),
        linear-gradient(135deg, #bce7fb, #e9f8ff 52%, #fff8e4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82), 0 7px 16px rgba(50, 112, 154, 0.16);
    }

    .avatar {
      width: 58px;
      height: 58px;
      object-fit: contain;
      image-rendering: auto;
      filter: drop-shadow(0 3px 5px rgba(74, 55, 32, 0.2));
    }

    .avatar[hidden],
    .avatar-fallback[hidden] {
      display: none;
    }

    .avatar-fallback {
      color: rgba(77, 60, 17, 0.74);
      font-size: 22px;
      font-weight: 900;
    }

    .bench {
      width: 112px;
      height: 22px;
      display: grid;
      grid-template-columns: repeat(5, 20px);
      gap: 3px;
      justify-content: center;
      align-items: center;
    }

    .mini-avatar {
      width: 20px;
      height: 20px;
      object-fit: contain;
      border: 1px solid rgba(255, 248, 228, 0.9);
      border-radius: 5px;
      background:
        radial-gradient(circle at 42% 28%, rgba(255, 255, 255, 0.56), transparent 34%),
        linear-gradient(135deg, #bce7fb, #e9f8ff 58%, #fff8e4);
      box-shadow: 0 2px 5px rgba(50, 112, 154, 0.14);
    }

    .mini-avatar[hidden] {
      display: none;
    }

    .main {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: 76px 176px minmax(232px, 1fr);
      gap: 8px;
      align-content: stretch;
    }

    .info-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: 20px 1fr;
      gap: 4px;
      padding: 8px 10px;
      overflow: hidden;
      border: 1px solid rgba(112, 177, 218, 0.5);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(235, 249, 255, 0.9), rgba(207, 236, 250, 0.72));
    }

    .info-title {
      display: inline-flex;
      align-items: center;
      color: #3e78a8;
      font-size: 12px;
      font-weight: 800;
    }

    .info-value {
      min-width: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.22;
      overflow: hidden;
      text-shadow: none;
    }

    .trait-panel {
      grid-template-rows: 1fr;
      align-items: center;
      justify-items: center;
      padding: 6px 8px;
    }

    .trait-panel .info-title {
      display: none;
    }

    .trait-panel .info-value {
      width: 100%;
      font-size: 14px;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .skill-panel {
      grid-template-rows: 1fr;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .skill-panel .info-title {
      display: none;
    }

    .skill-panel .buff-list {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, 112px);
      grid-auto-rows: 28px;
      justify-content: start;
      align-content: center;
      gap: 4px;
    }

    .buff-list {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
    }

    .buff-chip {
      max-width: 100%;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(234, 216, 181, 0.92);
      color: #4a3720;
      background: rgba(255, 247, 222, 0.88);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skill-chip {
      width: 112px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 5px 2px 3px;
      border-radius: 7px;
      border: 1px solid rgba(234, 216, 181, 0.92);
      color: #4a3720;
      background: rgba(255, 247, 222, 0.9);
      line-height: 1;
      overflow: hidden;
    }

    .skill-icon {
      position: relative;
      width: 48px;
      height: 22px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.55);
      color: #fffdf8;
    }

    .skill-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .skill-icon-label {
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: 2px;
      padding: 1px 2px;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(29, 26, 20, 0.72);
      color: #fff8e4;
      font-size: 8px;
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-copy {
      min-width: 0;
      display: grid;
      align-items: center;
    }

    .skill-damage {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #8a6f43;
      font-size: 11px;
      font-weight: 900;
    }

    .stats {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 5px;
      align-content: center;
    }

    .stat-cell {
      height: 24px;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      overflow: hidden;
      border-radius: 7px;
      border: 1px solid rgba(112, 177, 218, 0.5);
      background: linear-gradient(135deg, rgba(235, 249, 255, 0.92), rgba(255, 248, 228, 0.5));
    }

    .stat-label {
      color: #716a5c;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .stat-value {
      min-width: 0;
      color: #4a3720;
      font-size: 14px;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }

    /* qk-full-hud-six-stats-skills-v40: compact six-dimensional stats; all remaining room belongs to skills. */
    .region {
      grid-template-columns: 110px 244px minmax(0, 1fr);
      gap: 10px;
    }

    .main {
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      height: 100%;
    }

    .stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(4, 18px);
      gap: 3px 4px;
    }

    .stats .stat-cell {
      height: 18px;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 4px;
      padding: 0 6px;
      border-radius: 5px;
    }

    .stats .stat-label {
      font-size: 9px;
    }

    .stats .stat-value {
      font-size: 12px;
    }

    .stats .stat-speed {
      grid-column: 1 / -1;
      grid-template-columns: 48px minmax(0, 1fr);
    }

    .skill-panel {
      width: 100%;
      height: 100%;
    }

    .skill-panel .buff-list {
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: 24px;
      align-content: center;
      gap: 4px;
    }

    .skill-chip {
      width: 100%;
      height: 24px;
    }

    .skill-icon {
      height: 20px;
    }

    /* qk-full-hud-large-stable-skills-v41: larger skill cards and icons for the wider full HUD. */
    .skill-panel .buff-list {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: 72px;
      gap: 4px 6px;
    }

    .skill-chip {
      height: 72px;
      gap: 4px;
      padding: 2px 4px 2px 3px;
      border-radius: 8px;
    }

    .skill-icon {
      width: 66px;
      height: 26px;
      flex-basis: 66px;
      border-radius: 6px;
    }

    .skill-icon-label {
      font-size: 11px;
    }

    .skill-damage {
      font-size: 13px;
    }
    .skill-chip {
      position: relative;
    }

    .skill-icon {
      position: relative;
      inset: auto;
      z-index: 1;
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
    }

    .skill-icon img {
      object-fit: cover;
      object-position: center;
    }

    .skill-icon-label {
      z-index: 1;
    }

    .skill-copy {
      min-width: 0;
      margin-left: auto;
    }

    .skill-damage {
      padding: 0;
      background: transparent;
      box-shadow: none;
    }
    /* qk-full-hud-shared-data-v42: four equal 72px square skill slots. */
  </style>
</head>
<body>
  <main class="hud" id="hud" data-qk-hud-panel="full" title="drag">
        <section class="region" data-side="my">
      <div class="avatar-stack">
        <div class="avatar-box">
          <img class="avatar" data-role="avatar" alt="" hidden />
          <div class="avatar-fallback" data-role="fallback">?</div>
        </div>
        <div class="bench" data-role="bench"></div>
      </div>
      <div class="stats" data-role="stats">
        <div class="stat-cell"><span class="stat-label">&#29983;&#21629;&#33539;&#22260;</span><span class="stat-value" data-stat="hpRange">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#24403;&#21069;&#34880;&#37327;</span><span class="stat-value" data-stat="currentHp">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#29289;&#25915;</span><span class="stat-value" data-stat="phyAtk">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#39764;&#25915;</span><span class="stat-value" data-stat="magAtk">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#29289;&#38450;</span><span class="stat-value" data-stat="phyDef">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#39764;&#38450;</span><span class="stat-value" data-stat="magDef">--</span></div>
        <div class="stat-cell stat-speed"><span class="stat-label">&#36895;&#24230;</span><span class="stat-value" data-stat="speed">--</span></div>
      </div>
      <div class="main">
        <div class="info-panel skill-panel">
          <div class="info-title">&#25216;&#33021;</div>
          <div class="buff-list" data-role="skills"></div>
        </div>
      </div>
    </section>
        <section class="region" data-side="enemy">
      <div class="avatar-stack">
        <div class="avatar-box">
          <img class="avatar" data-role="avatar" alt="" hidden />
          <div class="avatar-fallback" data-role="fallback">?</div>
        </div>
        <div class="bench" data-role="bench"></div>
      </div>
      <div class="stats" data-role="stats">
        <div class="stat-cell"><span class="stat-label">&#29983;&#21629;&#33539;&#22260;</span><span class="stat-value" data-stat="hpRange">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#24403;&#21069;&#34880;&#37327;</span><span class="stat-value" data-stat="currentHp">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#29289;&#25915;</span><span class="stat-value" data-stat="phyAtk">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#39764;&#25915;</span><span class="stat-value" data-stat="magAtk">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#29289;&#38450;</span><span class="stat-value" data-stat="phyDef">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#39764;&#38450;</span><span class="stat-value" data-stat="magDef">--</span></div>
        <div class="stat-cell stat-speed"><span class="stat-label">&#36895;&#24230;</span><span class="stat-value" data-stat="speed">--</span></div>
      </div>
      <div class="main">
        <div class="info-panel skill-panel">
          <div class="info-title">&#25216;&#33021;</div>
          <div class="buff-list" data-role="skills"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const runtimeKeys = [
      "roco.battleHud.combatRuntime.v71",
      "roco.battleHud.combatRuntime.v62"
    ];
    const stateKeys = [
      "roco.battleHud.state.v52",
      "roco.battleHud.state.v50"
    ];
    let buffCalcMap = {};
    let rawBuffMap = {};
    Promise.all([
      fetch('/native-data/roco_buff_calc_map.json').then((response) => response.ok ? response.json() : {}),
      fetch('/native-data/authority/buff.json').then((response) => response.ok ? response.json() : {})
    ]).then(([calc, raw]) => {
      buffCalcMap = calc && typeof calc === 'object' ? calc : {};
      rawBuffMap = raw && typeof raw === 'object' ? raw : {};
      renderHud();
    }).catch(() => { buffCalcMap = {}; rawBuffMap = {}; });
    const enemyPreviewKey = "roco.battleHud.recognizedEnemyTeam.v52";
    const hpLockKey = "roco.fullHud.lockedMaxHp.v1";
    const sharedDamageKey = "roco.battleHud.damagePreviewSnapshot.v1";
    /* qk-full-hud-shared-index-v375: parse shared damage once per snapshot; query indexed buckets. */
    const sharedDamageCache = {
      rawText: null,
      byMoveId: new Map(),
      byMoveName: new Map(),
      order: new Map()
    };
    const pendingNative = new Map();
    const lastAvatarNames = { my: "", enemy: "" };
    const lastBenchSign = { my: "", enemy: "" };

    function parseJson(text) {
      if (!text) return null;
      try { return JSON.parse(text); } catch { return null; }
    }

    function readFirst(keys) {
      for (const key of keys) {
        const value = parseJson(localStorage.getItem(key));
        if (value) return value;
      }
      return null;
    }

    function cleanName(value) {
      return String(value || "")
        .replace(/\s+/g, "")
        .replace(/[0-9０-９]+级?$/g, "")
        .replace(/^【.*?】/, "")
        .trim();
    }

    function petNameFromEntry(entry) {
      if (!entry) return "";
      return cleanName(
        entry.petName ||
        entry.monsterName ||
        entry.displayName ||
        entry.avatar_name ||
        entry.name ||
        entry.localized?.zh?.name ||
        entry.monster?.localized?.zh?.name ||
        entry.monster?.name ||
        ""
      );
    }

    function numberValue(value) {
      const number = Number(value);
      return Number.isFinite(number) ? Math.round(number) : null;
    }

    function latestTimelinePet(runtime, side) {
      const list = Array.isArray(runtime?.battleTimeline) ? runtime.battleTimeline : [];
      for (let i = list.length - 1; i >= 0; i -= 1) {
        const item = list[i];
        if (item?.side !== side || item?.kind === "faint") continue;
        const name = cleanName(item.activePetName || item.petName || item.actorName);
        if (name) return name;
      }
      return "";
    }

    function stateTeamPet(state, side) {
      const team = side === "my" ? state?.myTeam : state?.enemyTeam;
      const index = side === "my" ? state?.myActiveIndex : state?.enemyActiveIndex;
      const safeIndex = Number.isInteger(index) ? Math.max(0, index) : 0;
      return petNameFromEntry(Array.isArray(team) ? team[safeIndex] || team[0] : null);
    }

    function activeEntry(runtime, state, side) {
      const team = teamEntries(runtime, state, side);
      const index = activeIndex(runtime, state, side);
      return team[index] || team[0] || null;
    }

    function activeIndex(runtime, state, side) {
      const stateIndex = side === "my" ? state?.myActiveIndex : state?.enemyActiveIndex;
      if (Number.isInteger(stateIndex)) return Math.max(0, stateIndex);
      const active = runtime?.active?.[side] || runtime?.[`${side}Active`] || runtime?.[`${side}Field`];
      if (Number.isInteger(active?.rosterIndex)) return Math.max(0, active.rosterIndex);
      return 0;
    }

    function teamEntries(runtime, state, side) {
      const stateTeam = side === "my" ? state?.myTeam : state?.enemyTeam;
      if (Array.isArray(stateTeam) && stateTeam.length) return stateTeam;
      const runtimeTeam = side === "my" ? runtime?.myTeam : runtime?.enemyTeam;
      if (Array.isArray(runtimeTeam) && runtimeTeam.length) return runtimeTeam;
      if (side === "enemy") {
        const preview = parseJson(localStorage.getItem(enemyPreviewKey));
        if (Array.isArray(preview?.enemyTeam) && preview.enemyTeam.length) return preview.enemyTeam;
      }
      return [];
    }

    function currentPetName(runtime, state, side) {
      const stateName = stateTeamPet(state, side);
      if (stateName) return stateName;

      const active = runtime?.active?.[side] || runtime?.[`${side}Active`] || runtime?.[`${side}Field`];
      const activeName = cleanName(
        active?.monsterName ||
        active?.petName ||
        active?.displayName ||
        active?.activePetName ||
        active?.rawProtocolName ||
        ""
      );
      if (activeName) return activeName;

      const timelineName = latestTimelinePet(runtime, side);
      if (timelineName) return timelineName;

      const team = side === "my" ? runtime?.myTeam : runtime?.enemyTeam;
      const index = Number.isInteger(active?.rosterIndex) ? active.rosterIndex : 0;
      const teamName = petNameFromEntry(Array.isArray(team) ? team[index] || team[0] : null);
      if (teamName) return teamName;

      if (side === "enemy") {
        const preview = parseJson(localStorage.getItem(enemyPreviewKey));
        const previewName = petNameFromEntry(Array.isArray(preview?.enemyTeam) ? preview.enemyTeam[0] : null);
        if (previewName) return previewName;
      }
      return "";
    }

    function hpText(runtime, side) {
      const hp = runtime?.hp?.[side];
      if (typeof hp?.hpAfter === "number") return `${Math.max(0, Math.round(hp.hpAfter))} HP`;
      if (typeof hp?.percent === "number") return `${Math.round(hp.percent)}%`;
      return "--";
    }

    function baseMonster(entry) {
      const monster = entry?.monster || entry;
      return monster && numberValue(monster.base_hp) != null && numberValue(monster.base_spd) != null ? monster : null;
    }

    function exactStats(entry) {
      return entry?.rkppStats?.stats || entry?.stats || null;
    }

    function calcHp(baseHp, boost = 0, mod = 0) {
      const first = Math.round(170 * (baseHp + 3 * boost) / 100 + 70);
      return Math.round(first * (1 + mod) + 100);
    }

    function calcSpeed(baseSpd, boost = 0, mod = 0) {
      const first = Math.round(110 * (baseSpd + 3 * boost) / 100 + 10);
      return Math.round(first * (1 + mod) + 50);
    }

    function formatRange(values) {
      const numbers = values.map(numberValue).filter((value) => value != null).sort((a, b) => a - b);
      if (!numbers.length) return "--";
      const min = numbers[0];
      const max = numbers[numbers.length - 1];
      return min === max ? String(min) : `${min}-${max}`;
    }

    function hpRangeFromEntry(entry) {
      const stats = exactStats(entry);
      const exactHp = numberValue(stats?.hp ?? entry?.maxHp ?? entry?.battleMaxHp);
      if (exactHp != null) return String(exactHp);
      const monster = baseMonster(entry);
      if (!monster) return "--";
      const baseHp = numberValue(monster.base_hp);
      return formatRange([calcHp(baseHp, 0, 0), calcHp(baseHp, 10, 0)]);
    }

    function speedFromEntry(entry) {
      const stats = exactStats(entry);
      const exactSpeed = numberValue(stats?.spd ?? stats?.speed);
      if (exactSpeed != null) return String(exactSpeed);
      const monster = baseMonster(entry);
      if (!monster) return "--";
      const baseSpd = numberValue(monster.base_spd);
      return formatRange([
        calcSpeed(baseSpd, 0, -0.1),
        calcSpeed(baseSpd, 0, 0),
        calcSpeed(baseSpd, 10, 0),
        calcSpeed(baseSpd, 10, 0.1)
      ]);
    }

    function latestHpData(runtime, side) {
      const current = runtime?.hp?.[side];
      if (current) return current;
      const events = Array.isArray(runtime?.hpEvents) ? runtime.hpEvents : [];
      for (let i = events.length - 1; i >= 0; i -= 1) {
        if (events[i]?.side === side) return events[i];
      }
      return null;
    }

    function readHpLocks() {
      return parseJson(localStorage.getItem(hpLockKey)) || {};
    }

    function writeHpLock(side, name, maxHp) {
      if (!name || maxHp == null) return;
      const locks = readHpLocks();
      const key = `${side}:${name}`;
      if (locks[key]) return;
      locks[key] = { maxHp, ts: Date.now() };
      try { localStorage.setItem(hpLockKey, JSON.stringify(locks)); } catch {}
    }

    function lockedMaxHp(side, name) {
      const value = readHpLocks()[`${side}:${name}`]?.maxHp;
      return numberValue(value);
    }

    function statTexts(runtime, state, side, name) {
      const entry = activeEntry(runtime, state, side);
      const stats = exactStats(entry) || {};
      const hpData = latestHpData(runtime, side);
      const damage = numberValue(hpData?.damage);
      const hpAfter = numberValue(hpData?.hpAfter);
      if (damage != null && damage > 0 && hpAfter != null) {
        writeHpLock(side, name, damage + hpAfter);
      }
      const locked = lockedMaxHp(side, name);
      const range = locked != null ? String(locked) : hpRangeFromEntry(entry);
      let current = hpAfter != null ? String(Math.max(0, hpAfter)) : "--";
      if (current === "--") {
        const entryCurrent = numberValue(entry?.currentHp ?? entry?.remainHp ?? entry?.current_hp);
        if (entryCurrent != null) current = String(entryCurrent);
      }
      if (current === "--" && locked != null && typeof hpData?.percent === "number") {
        current = String(Math.max(0, Math.round(locked * hpData.percent / 100)));
      }
      if (current === "--" && stats?.hp != null && side === "my") {
        current = String(numberValue(stats.hp));
      }
      const statRange = (names, baseName) => {
        const exact = statNumber(stats, names);
        if (exact != null) return String(exact);
        const base = numberValue(entryMonster(entry)?.[baseName]);
        if (base == null) return "--";
        const values = [];
        for (const boost of [0, 7, 8, 9, 10]) {
          for (const modifier of [-0.1, 0, 0.2]) values.push(calcBattleStat(base, boost, modifier));
        }
        return formatRange(values);
      };
      return {
        hpRange: range,
        currentHp: current,
        phyAtk: statRange(["phyAtk", "phy_atk", "physicalAttack"], "base_phy_atk"),
        magAtk: statRange(["magAtk", "mag_atk", "magicAttack"], "base_mag_atk"),
        phyDef: statRange(["phyDef", "phy_def", "physicalDefense"], "base_phy_def"),
        magDef: statRange(["magDef", "mag_def", "magicDefense"], "base_mag_def"),
        speed: statRange(["spd", "speed"], "base_spd")
      };
    }

    function textValue(value) {
      if (value == null) return "";
      if (typeof value === "string" || typeof value === "number") return String(value).trim();
      return String(value.localized?.zh?.name || value.localized?.zh || value.name || value.text || value.value || "").trim();
    }

    function normalizeTraitName(name) {
      const text = String(name || "").trim();
      if (text.startsWith("\u5408\u62cd")) return "\u5408\u62cd";
      return text;
    }

    function traitText(runtime, state, side) {
      const activeTraits = (runtime?.active?.[side]?.traits || []).map((item) => normalizeTraitName(textValue(item))).filter(Boolean);
      if (activeTraits.length) return activeTraits[0];
      const entry = activeEntry(runtime, state, side);
      const monster = baseMonster(entry) || entry?.monster || entry;
      return normalizeTraitName(textValue(monster?.trait)) || "--";
    }

    function buffItems(runtime, side) {
      const effects = runtime?.active?.[side]?.effects || {};
      const groups = [
        effects.buffs || [],
        effects.debuffs || [],
        effects.marks || [],
        effects.specialStacks || []
      ];
      return groups
        .flat()
        .map((item) => {
          const name = textValue(item);
          if (!name) return "";
          const stacks = numberValue(item?.stacks);
          return stacks != null && stacks > 1 ? `${name}x${stacks}` : name;
        })
        .filter(Boolean)
        .slice(0, 6);
    }

    function renderBuffs(region, runtime, side) {
      const host = region.querySelector('[data-role="buffs"]');
      const items = buffItems(runtime, side);
      renderChipList(host, items);
    }

    function renderChipList(host, items) {
      host.replaceChildren();
      if (!items.length) {
        const empty = document.createElement("span");
        empty.className = "buff-chip";
        empty.textContent = "--";
        host.appendChild(empty);
        return;
      }
      for (const item of items) {
        const chip = document.createElement("span");
        chip.className = "buff-chip";
        chip.textContent = item;
        host.appendChild(chip);
      }
    }

    function samePetName(left, right) {
      const normalize = (value) => String(value || "").replace(/[\s\u00a0·・,，。.!！?？:：;；()（）\[\]【】<>《》「」'"“”‘’_-]/g, "").toLowerCase();
      const a = normalize(left);
      const b = normalize(right);
      return !!a && !!b && a === b;
    }

    function skillNameFromMove(move) {
      return textValue(move) ||
        textValue(move?.localized?.zh?.name) ||
        textValue(move?.localized?.zh) ||
        textValue(move?.skillName) ||
        textValue(move?.moveName) ||
        textValue(move?.name);
    }

    function addSkillNames(target, values) {
      if (!Array.isArray(values)) return;
      for (const value of values) {
        const name = skillNameFromMove(value);
        if (name) target.add(name);
      }
    }

    function configuredSkillsFromEntry(entry, includeFallbackPool) {
      const skills = new Set();
      addSkillNames(skills, entry?.selectedMoves);
      addSkillNames(skills, entry?.selectedSkillNames);
      addSkillNames(skills, entry?.skillNames);
      addSkillNames(skills, entry?.SkillNames);
      addSkillNames(skills, entry?.skills);
      addSkillNames(skills, entry?.moves);
      if (!skills.size && includeFallbackPool) {
        addSkillNames(skills, entry?.monster?.move_pool);
        addSkillNames(skills, entry?.move_pool);
      }
      return Array.from(skills).filter(Boolean).slice(0, 4);
    }

    function findMoveByName(entry, name) {
      const pools = [
        entry?.selectedMoves,
        entry?.moves,
        entry?.skills,
        entry?.monster?.move_pool,
        entry?.move_pool
      ];
      for (const pool of pools) {
        if (!Array.isArray(pool)) continue;
        const match = pool.find((move) => samePetName(skillNameFromMove(move), name));
        if (match) return match;
      }
      return null;
    }

    function addSkillItems(target, seen, entry, values) {
      if (!Array.isArray(values)) return;
      for (const value of values) {
        const name = skillNameFromMove(value);
        if (!name || seen.has(name)) continue;
        seen.add(name);
        target.push({
          name,
          move: typeof value === "object" && value ? value : findMoveByName(entry, name)
        });
      }
    }

    function configuredSkillItemsFromEntry(entry, includeFallbackPool) {
      const items = [];
      const seen = new Set();
      addSkillItems(items, seen, entry, entry?.selectedMoves);
      addSkillItems(items, seen, entry, entry?.selectedSkillNames);
      addSkillItems(items, seen, entry, entry?.skillNames);
      addSkillItems(items, seen, entry, entry?.SkillNames);
      addSkillItems(items, seen, entry, entry?.skills);
      addSkillItems(items, seen, entry, entry?.moves);
      if (!items.length && includeFallbackPool) {
        addSkillItems(items, seen, entry, entry?.monster?.move_pool);
        addSkillItems(items, seen, entry, entry?.move_pool);
      }
      return items.slice(0, 4);
    }

    function isExcludedEnemyKnownSkill(name) {
      const clean = String(name || "").replace(/\(\d+\)\s*$/g, "").replace(/[\s\u00a0·・,，。.!！?？:：;；()（）\[\]【】<>《》「」'"“”‘’_-]/g, "");
      return clean === "聚能" || clean === "蓄力";
    }

    function knownSkills(runtime, state, side, activeName) {
      const skills = new Set();
      if (side === "my") {
        for (const name of configuredSkillsFromEntry(activeEntry(runtime, state, side), true)) skills.add(name);
      }
      const observed = runtime?.observedEnemyMoves || {};
      if (side === "enemy") {
        for (const [petName, moves] of Object.entries(observed)) {
          if (!samePetName(petName, activeName)) continue;
          for (const move of moves || []) {
            const name = textValue(move);
            if (name && !isExcludedEnemyKnownSkill(name)) skills.add(name);
          }
        }
      }
      const timeline = Array.isArray(runtime?.battleTimeline) ? runtime.battleTimeline : [];
      for (const item of timeline) {
        if (item?.side !== side) continue;
        const actor = item.activePetName || item.actorName || item.petName;
        if (activeName && actor && !samePetName(actor, activeName)) continue;
        const directName = textValue(item.skillName || item.moveName || item.skill?.name || item.move?.name);
        if (directName && !(side === "enemy" && isExcludedEnemyKnownSkill(directName))) skills.add(directName);
        if (item?.rawKind === "used_original_skill" || item?.type === "original_skills_snapshot") {
          const text = textValue(item.text);
          const payload = text.replace(/^.*?(?:：|:)/, "");
          for (const rawName of payload.split(/[、,，|/]+/)) {
            const name = textValue(rawName);
            if (name && !(side === "enemy" && isExcludedEnemyKnownSkill(name))) skills.add(name);
          }
        }
      }
      return Array.from(skills).filter(Boolean);
    }

    const typeChart = {
      Normal: [],
      Grass: ["Water", "Ground"],
      Fire: ["Grass", "Ice", "Bug", "Mechanical"],
      Water: ["Fire", "Ground"],
      Light: ["Ghost", "Dark"],
      Electric: ["Water", "Flying"],
      Ground: ["Fire", "Electric", "Poison", "Mechanical"],
      Ice: ["Grass", "Ground", "Flying", "Dragon"],
      Poison: ["Grass", "Cute"],
      Bug: ["Grass", "Dark", "Illusion"],
      Fighting: ["Normal", "Ice", "Dark", "Mechanical"],
      Dragon: ["Dragon"],
      Flying: ["Grass", "Fighting", "Bug"],
      Cute: ["Fighting", "Dragon"],
      Ghost: ["Ghost", "Illusion"],
      Dark: ["Ghost", "Illusion"],
      Mechanical: ["Ice", "Cute", "Illusion"],
      Illusion: ["Fighting", "Cute"]
    };

    function cleanAssetName(name) {
      return String(name || "").replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, "").trim();
    }

    function pushSkillAssetName(target, value) {
      const clean = cleanAssetName(value);
      if (clean && !target.includes(clean)) target.push(clean);
    }

    function pushSkillAssetFile(target, value) {
      let text = textValue(value);
      if (!text) return;
      text = text.replace(/\\/g, "/").replace(/^Texture2D'/, "").replace(/'$/g, "");
      let leaf = text.split("/").pop() || text;
      leaf = leaf.replace(/\.(png|jpg|jpeg|webp)$/i, "");
      if (leaf.includes(".")) leaf = leaf.split(".").pop() || leaf;
      pushSkillAssetName(target, leaf);
    }

    function skillIconUrls(item) {
      const move = item?.move && typeof item.move === "object" ? item.move : (item && typeof item === "object" ? item : null);
      const name = typeof item === "string" ? item : item?.name;
      const candidates = [];
      for (const value of [
        move?.id,
        move?.skill_id,
        move?.skillId,
        move?.conf_id,
        move?.confId,
        move?.skillConfId
      ]) {
        pushSkillAssetName(candidates, value);
      }
      pushSkillAssetFile(candidates, move?.rawIconFile);
      pushSkillAssetFile(candidates, move?.namedIconFile);
      pushSkillAssetFile(candidates, move?.iconId);
      pushSkillAssetFile(candidates, move?.icon);
      pushSkillAssetName(candidates, name);
      return candidates.map((candidate) => `/roco-skill-icons/${encodeURIComponent(candidate)}.png`);
    }

    function typeName(value) {
      return textValue(value?.name || value);
    }

    function entryMonster(entry) {
      return entry?.monster || entry || null;
    }

    function calcBattleStat(base, boost = 0, mod = 0) {
      if (base == null) return null;
      const raw = 110 * (base + 3 * boost) / 100 + 10;
      const base105Neutral = Number(base) === 105 && Number(boost) === 0 && Number(mod) === 0;
      const first = base105Neutral ? Math.floor(raw) : Math.round(raw);
      return Math.round(first * (1 + mod) + 50);
    }

    function statNumber(stats, names) {
      for (const name of names) {
        const value = numberValue(stats?.[name]);
        if (value != null) return value;
      }
      return null;
    }

    function battleStats(entry, rawSource) {
      const stats = exactStats(entry) || {};
      const monster = entryMonster(entry);
      const effects = rawBuffTotals(rawBuffEntries(rawSource || entry));
      const scale = (value) => 1 + (value || 0) / 100;
      return {
        phyAtk: (statNumber(stats, ["phyAtk", "phy_atk", "physicalAttack"]) ?? calcBattleStat(numberValue(monster?.base_phy_atk))) * scale(effects.phyAtkPercent),
        magAtk: (statNumber(stats, ["magAtk", "mag_atk", "magicAttack"]) ?? calcBattleStat(numberValue(monster?.base_mag_atk))) * scale(effects.magAtkPercent),
        phyDef: (statNumber(stats, ["phyDef", "phy_def", "physicalDefense"]) ?? calcBattleStat(numberValue(monster?.base_phy_def))) * scale(effects.phyDefPercent),
        magDef: (statNumber(stats, ["magDef", "mag_def", "magicDefense"]) ?? calcBattleStat(numberValue(monster?.base_mag_def))) * scale(effects.magDefPercent),
        powerPercent: effects.powerPercent || 0,
        damageTakenPercent: effects.damageTakenPercent || 0,
        flatPowerBonus: effects.flatPowerBonus || 0
      };
    }

    function rawBuffEntries(source) {
      const effects = source?.rawEffects || source?.effects || source?.activeEffects || source?.raw?.effects || {};
      const values = [];
      const collect = (value, key = null) => {
        if (Array.isArray(value)) { value.forEach((item) => collect(item)); return; }
        if (!value || typeof value !== "object") return;
        const id = numberValue(value.id ?? value.buffId ?? value.effectId ?? value.buff_id ?? value.effect_id ?? key);
        if (id != null) { values.push({ ...value, __rawBuffId: id }); return; }
        Object.entries(value).forEach(([childKey, child]) => collect(child, childKey));
      };
      collect(effects);
      return values.map((item) => {
        const id = numberValue(item.__rawBuffId);
        const stacks = Math.max(1, numberValue(item?.stacks ?? item?.count ?? item?.layer ?? item?.level) || 1);
        return id == null ? null : { id: String(id), stacks };
      }).filter(Boolean);
    }

    function rawBaseRule(raw) {
      const ids = raw?.buff_base_ids || raw?.buffBaseIds || [];
      const count = (id) => ids.filter((value) => Number(value) === id).length * 10;
      return {
        phyAtkPercent: count(2001001) - count(2001003),
        magAtkPercent: count(2001002) - count(2001004),
        phyDefPercent: count(2001005) - count(2001007),
        magDefPercent: count(2001006) - count(2001008)
      };
    }

    function rawBuffTotals(entries) {
      const totals = { phyAtkPercent: 0, magAtkPercent: 0, phyDefPercent: 0, magDefPercent: 0, powerPercent: 0, damageTakenPercent: 0, flatPowerBonus: 0 };
      for (const item of entries) {
        const rule = buffCalcMap[item.id] || rawBaseRule(rawBuffMap[item.id]);
        if (!rule) continue;
        for (const key of Object.keys(totals)) totals[key] += (numberValue(rule[key]) || 0) * item.stacks;
      }
      return totals;
    }

    function buffAdjustedCandidates(entry, category, defense, rawSource) {
      const values = defense ? defenseCandidates(entry, category) : attackCandidates(entry, category);
      const totals = rawBuffTotals(rawBuffEntries(rawSource));
      const percent = category === "Physical Attack"
        ? (defense ? totals.phyDefPercent : totals.phyAtkPercent)
        : (defense ? totals.magDefPercent : totals.magAtkPercent);
      return values.map((value) => value * (1 + percent / 100));
    }

    function statCandidates(entry, exactNames, baseName, boostRange) {
      const stats = exactStats(entry) || {};
      const exact = statNumber(stats, exactNames);
      if (exact != null) return [exact];
      const base = numberValue(entryMonster(entry)?.[baseName]);
      if (base == null) return [];
      const boosts = boostRange ? [0, 10] : [0];
      return [...new Set(boosts.map((boost) => calcBattleStat(base, boost)).filter((value) => value != null))].sort((a, b) => a - b);
    }

    function attackCandidates(entry, category) {
      return category === "Physical Attack"
        ? statCandidates(entry, ["phyAtk", "phy_atk", "physicalAttack"], "base_phy_atk", false)
        : statCandidates(entry, ["magAtk", "mag_atk", "magicAttack"], "base_mag_atk", false);
    }

    function defenseCandidates(entry, category) {
      return category === "Physical Attack"
        ? statCandidates(entry, ["phyDef", "phy_def", "physicalDefense"], "base_phy_def", true)
        : statCandidates(entry, ["magDef", "mag_def", "magicDefense"], "base_mag_def", true);
    }

    function movePower(move) {
      return numberValue(move?.power ?? move?.skillPower);
    }

    function moveEnergy(move) {
      return numberValue(move?.energy_cost ?? move?.energyCost ?? move?.cost);
    }

    function moveType(move) {
      return typeName(move?.move_type) || typeName(move?.type);
    }

    function moveCategory(move) {
      const value = textValue(move?.move_category || move?.category || move?.damageType);
      if (/Physical/i.test(value) || value.includes("\u7269")) return "Physical Attack";
      if (/Magic/i.test(value) || value.includes("\u9b54")) return "Magic Attack";
      return value;
    }

    function nonDamageSkillText(move) {
      const category = textValue(move?.move_category || move?.category || move?.damageType || move?.categoryText);
      if (/Defense/i.test(category) || category.includes("\u9632\u5fa1")) return "\u9632\u5fa1";
      if (/Status/i.test(category) || category.includes("\u72b6\u6001")) return "\u72b6\u6001";
      return "\u8f85\u52a9";
    }

    function defenderTypes(entry) {
      const monster = entryMonster(entry);
      return [typeName(monster?.main_type), typeName(monster?.sub_type)].filter(Boolean);
    }

    function effectiveness(moveTypeName, targetTypes) {
      if (!moveTypeName) return 1;
      let value = 1;
      for (const target of targetTypes) {
        if ((typeChart[moveTypeName] || []).includes(target)) value *= 2;
      }
      return value;
    }

    function sameTypeAttackBonus(moveTypeName, attackerEntry) {
      const monster = entryMonster(attackerEntry);
      const types = [typeName(monster?.main_type), typeName(monster?.sub_type)];
      return moveTypeName && types.includes(moveTypeName);
    }

    function sharedDamageMoveNameKey(value) {
      return String(value || "")
        .replace(/[\s\u00a0·・,，。.!！?？:：;；()（）\[\]【】<>《》「」'"“”‘’_-]/g, "")
        .toLowerCase();
    }

    function appendSharedDamageIndex(map, key, entry) {
      if (!key) return;
      const bucket = map.get(key);
      if (bucket) bucket.push(entry);
      else map.set(key, [entry]);
    }

    function refreshSharedDamageIndex() {
      let rawText = "";
      try { rawText = localStorage.getItem(sharedDamageKey) || ""; } catch { return; }
      if (rawText === sharedDamageCache.rawText) return;
      sharedDamageCache.rawText = rawText;
      sharedDamageCache.byMoveId = new Map();
      sharedDamageCache.byMoveName = new Map();
      sharedDamageCache.order = new Map();
      const snapshot = parseJson(rawText);
      const entries = snapshot?.entries && typeof snapshot.entries === "object" ? Object.values(snapshot.entries) : [];
      entries.forEach((entry, index) => {
        if (!entry) return;
        sharedDamageCache.order.set(entry, index);
        const scope = `${entry.attackerSide || ""}|${entry.surface || ""}|`;
        const entryMoveId = numberValue(entry.move?.id);
        if (entryMoveId != null) appendSharedDamageIndex(sharedDamageCache.byMoveId, `${scope}${entryMoveId}`, entry);
        const entryMoveName = sharedDamageMoveNameKey(entry.move?.name);
        if (entryMoveName) appendSharedDamageIndex(sharedDamageCache.byMoveName, `${scope}${entryMoveName}`, entry);
      });
    }

    function sharedDamageText(runtime, attackerSide, attackerEntry, defenderEntry, move) {
      const surface = attackerSide === "my" ? "my_attack_card" : "enemy_attack_card";
      const scope = `${attackerSide}|${surface}|`;
      const runtimeSession = textValue(runtime?.sessionId || runtime?.battleId).replace(/^battle-/, "");
      const moveId = numberValue(move?.id ?? move?.moveId ?? move?.skill_id);
      const moveName = skillNameFromMove(move);
      const attackerId = numberValue(entryMonster(attackerEntry)?.id ?? entryMonster(attackerEntry)?.petBaseId);
      const defenderId = numberValue(entryMonster(defenderEntry)?.id ?? entryMonster(defenderEntry)?.petBaseId);
      const attackerName = petNameFromEntry(attackerEntry);
      const defenderName = petNameFromEntry(defenderEntry);
      const candidates = new Set();
      if (moveId != null) {
        for (const entry of sharedDamageCache.byMoveId.get(`${scope}${moveId}`) || []) candidates.add(entry);
      }
      const moveNameKey = sharedDamageMoveNameKey(moveName);
      if (moveNameKey) {
        for (const entry of sharedDamageCache.byMoveName.get(`${scope}${moveNameKey}`) || []) candidates.add(entry);
      }
      let latest = null;
      let latestTs = -Infinity;
      let latestOrder = Infinity;
      for (const entry of candidates) {
        if (!entry || entry.attackerSide !== attackerSide || entry.surface !== surface) continue;
        const entrySession = textValue(entry.sessionId || entry.battleId).replace(/^battle-/, "");
        if (runtimeSession && entrySession && runtimeSession !== entrySession) continue;
        const entryMoveId = numberValue(entry.move?.id);
        const sameMove = moveId != null && entryMoveId != null
          ? moveId === entryMoveId
          : samePetName(moveName, entry.move?.name);
        if (!sameMove) continue;
        const sameActor = attackerId != null && numberValue(entry.attacker?.id) != null
          ? attackerId === numberValue(entry.attacker.id)
          : !attackerName || !entry.attacker?.name || samePetName(attackerName, entry.attacker.name);
        const sameTarget = defenderId != null && numberValue(entry.defender?.id) != null
          ? defenderId === numberValue(entry.defender.id)
          : !defenderName || !entry.defender?.name || samePetName(defenderName, entry.defender.name);
        if (!sameActor || !sameTarget) continue;
        const timestamp = Number(entry.updatedAt || entry.runtimeTs || 0);
        const order = sharedDamageCache.order.get(entry) ?? Infinity;
        if (latest == null || timestamp > latestTs || (timestamp === latestTs && order < latestOrder)) {
          latest = entry;
          latestTs = timestamp;
          latestOrder = order;
        }
      }
      return textValue(latest?.result?.displayText);
    }

    function skillDamageText(move, attackerEntry, defenderEntry, runtime, attackerSide) {
      const shared = sharedDamageText(runtime, attackerSide, attackerEntry, defenderEntry, move);
      if (shared) return shared;
      const power = movePower(move);
      if (!move || power == null || power <= 0) return nonDamageSkillText(move);
      return "--";
    }

    function renderSkillList(host, items) {
      const models = items.map((item) => {
        const iconUrls = skillIconUrls(item);
        return {
          item,
          iconUrls,
          key: JSON.stringify([item.name || "", iconUrls])
        };
      });
      const signature = JSON.stringify(models.map((model) => model.key));

      if (host.dataset.skillSignature === signature) {
        const chips = host.querySelectorAll(".skill-chip");
        if (chips.length === models.length) {
          models.forEach(({ item }, index) => {
            const chip = chips[index];
            const detail = item.detail || "--";
            chip.title = `${item.name} ${item.detail || ""}`.trim();
            const damage = chip.querySelector(".skill-damage");
            if (damage && damage.textContent !== detail) damage.textContent = detail;
          });
          return;
        }
      }

      host.dataset.skillSignature = signature;
      host.replaceChildren();
      if (!models.length) {
        const empty = document.createElement("span");
        empty.className = "buff-chip";
        empty.textContent = "--";
        host.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      for (const { item, iconUrls } of models) {
        const chip = document.createElement("span");
        chip.className = "skill-chip";

        const icon = document.createElement("span");
        icon.className = "skill-icon";
        const img = document.createElement("img");
        img.alt = "";
        img.draggable = false;
        let iconIndex = 0;
        img.onerror = () => {
          iconIndex += 1;
          if (iconIndex < iconUrls.length) img.src = iconUrls[iconIndex];
          else img.remove();
        };
        if (iconUrls.length) img.src = iconUrls[0];
        icon.appendChild(img);

        const label = document.createElement("span");
        label.className = "skill-icon-label";
        label.textContent = item.name;
        icon.appendChild(label);

        const copy = document.createElement("span");
        copy.className = "skill-copy";
        const damage = document.createElement("span");
        damage.className = "skill-damage";
        damage.textContent = item.detail || "--";
        copy.appendChild(damage);

        chip.title = `${item.name} ${item.detail || ""}`.trim();
        chip.appendChild(icon);
        chip.appendChild(copy);
        fragment.appendChild(chip);
      }
      host.appendChild(fragment);
    }

    function renderSkills(region, runtime, state, side, activeName) {
      const host = region.querySelector('[data-role="skills"]');
      const attackerEntry = activeEntry(runtime, state, side);
      const defenderEntry = activeEntry(runtime, state, side === "my" ? "enemy" : "my");
      const items = [];
      const seen = new Set();
      if (side === "my") {
        for (const item of configuredSkillItemsFromEntry(attackerEntry, true)) {
          if (!item.name || seen.has(item.name)) continue;
          seen.add(item.name);
          items.push({
            name: item.name,
            move: item.move,
            detail: skillDamageText(item.move, attackerEntry, defenderEntry, runtime, side)
          });
        }
      }
      for (const name of knownSkills(runtime, state, side, activeName)) {
        if (!name || seen.has(name)) continue;
        seen.add(name);
        const move = findMoveByName(attackerEntry, name);
        items.push({
          name,
          move,
          detail: move ? skillDamageText(move, attackerEntry, defenderEntry, runtime, side) : (side === "enemy" ? "已确认" : "--")
        });
      }
      renderSkillList(host, items);
    }

    function avatarCandidates(name, entry = null) {
      const clean = cleanName(name);
      if (!clean) return [];
      const normalized = clean
        .trim()
        .replace(/（/g, "(")
        .replace(/）/g, ")")
        .replace(/[－—]/g, "-")
        .replace(/\s+/g, "");
      const candidates = [];
      if (petAvatarByName[normalized]) candidates.push(petAvatarByName[normalized]);
      for (const rawId of [
        entry?.iconId, entry?.icon_id, entry?.monster?.iconId, entry?.monster?.icon_id,
        entry?.monsterId, entry?.monster_id, entry?.id, entry?.baseConfId,
        entry?.base_conf_id, entry?.petBaseId, entry?.petbase_id, entry?.petId, entry?.pet_id
      ]) {
        const id = String(rawId ?? "").trim();
        if (/^\d+(?:_1)?$/.test(id)) {
          candidates.push(`/roco-pet-avatars-id/${encodeURIComponent(id)}.png`);
        }
      }
      return [...new Set(candidates)];
    }

    function setAvatar(region, side, name, entry = null) {
      const img = region.querySelector('[data-role="avatar"]');
      const fallback = region.querySelector('[data-role="fallback"]');
      if (!name) {
        img.hidden = true;
        fallback.hidden = false;
        fallback.textContent = "?";
        lastAvatarNames[side] = "";
        return;
      }
      fallback.textContent = name.slice(0, 1);
      if (lastAvatarNames[side] === name && !img.hidden) return;
      lastAvatarNames[side] = name;
      const candidates = avatarCandidates(name, entry);
      let index = 0;
      img.onerror = () => {
        index += 1;
        if (index < candidates.length) {
          img.src = candidates[index];
          return;
        }
        img.hidden = true;
        fallback.hidden = false;
      };
      img.onload = () => {
        fallback.hidden = true;
        img.hidden = false;
      };
      img.alt = name;
      fallback.hidden = false;
      img.hidden = true;
      img.src = candidates[0] || "";
    }

    function setMiniAvatar(img, name, entry = null) {
      const candidates = avatarCandidates(name, entry);
      let index = 0;
      img.hidden = true;
      img.alt = name || "";
      img.onerror = () => {
        index += 1;
        if (index < candidates.length) {
          img.src = candidates[index];
          return;
        }
        img.hidden = true;
      };
      img.onload = () => {
        img.hidden = false;
      };
      img.src = candidates[0] || "";
    }

    function renderBench(region, runtime, state, side, activeName) {
      const bench = region.querySelector('[data-role="bench"]');
      const skipIndex = activeIndex(runtime, state, side);
      const names = teamEntries(runtime, state, side)
        .map((entry, index) => ({ name: petNameFromEntry(entry), index, entry }))
        .filter((item) => item.name)
        .filter((item) => item.index !== skipIndex && item.name !== activeName)
        .slice(0, 5);
      const signature = names.map((item) => `${item.index}:${item.name}`).join("|");
      if (lastBenchSign[side] === signature) return;
      lastBenchSign[side] = signature;
      bench.replaceChildren();
      for (const item of names) {
        const img = document.createElement("img");
        img.className = "mini-avatar";
        setMiniAvatar(img, item.name, item.entry);
        bench.appendChild(img);
      }
    }

    function renderSide(runtime, state, side) {
      const region = document.querySelector(`[data-side="${side}"]`);
      const name = currentPetName(runtime, state, side);
      const entry = activeEntry(runtime, state, side);
      const stats = statTexts(runtime, state, side, name);
      for (const [key, value] of Object.entries(stats)) {
        const host = region.querySelector(`[data-stat="${key}"]`);
        if (host) host.textContent = value;
      }
      renderSkills(region, runtime, state, side, name);
      setAvatar(region, side, name, entry);
      renderBench(region, runtime, state, side, name);
    }

    function renderHud() {
      refreshSharedDamageIndex();
      const runtime = readFirst(runtimeKeys);
      const state = readFirst(stateKeys);
      renderSide(runtime, state, "my");
      renderSide(runtime, state, "enemy");
    }

    function nextId() {
      return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now() + Math.random());
    }

    function sendWindow(method, args = {}) {
      const host = window.chrome && window.chrome.webview;
      if (!host) return Promise.resolve(null);
      const id = nextId();
      const promise = new Promise((resolve) => {
        pendingNative.set(id, resolve);
        window.setTimeout(() => {
          if (!pendingNative.has(id)) return;
          pendingNative.delete(id);
          resolve(null);
        }, 1000);
      });
      host.postMessage({ id, kind: "window", method, args });
      return promise;
    }

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener("message", (event) => {
        const payload = event.data || {};
        const resolve = pendingNative.get(payload.id);
        if (!resolve) return;
        pendingNative.delete(payload.id);
        resolve(payload.ok ? payload.value : null);
      });
    }

    const hud = document.getElementById("hud");
    let drag = null;

    hud.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      hud.setPointerCapture(event.pointerId);
      drag = {
        pointerId: event.pointerId,
        startScreenX: event.screenX,
        startScreenY: event.screenY,
        startX: window.screenX || 0,
        startY: window.screenY || 0
      };
    });

    hud.addEventListener("pointermove", (event) => {
      if (!drag || event.pointerId !== drag.pointerId || (event.buttons & 1) !== 1) return;
      const x = drag.startX + event.screenX - drag.startScreenX;
      const y = drag.startY + event.screenY - drag.startScreenY;
      sendWindow("setPosition", { x, y });
    });

    function stopDrag(event) {
      if (drag && event.pointerId === drag.pointerId) {
        drag = null;
      }
    }

    hud.addEventListener("pointerup", stopDrag);
    hud.addEventListener("pointercancel", stopDrag);
    window.addEventListener("storage", renderHud);
    renderHud();
    window.setInterval(renderHud, 50);
  </script>
</body>
