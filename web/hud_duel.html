<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>洛克 PVP 对局面板</title>
<style>
  /* 一屏左右两条竖面板：?side=my 贴屏幕左侧，?side=enemy 贴右侧。
     版式参照第三方原版：头像+名字+等级 → 血条 → 六维 → 状态 → 四个技能（竖排）。 */
  :root {
    --my-a: rgba(24, 74, 118, 0.60);
    --my-b: rgba(14, 40, 66, 0.66);
    --enemy-a: rgba(118, 40, 30, 0.60);
    --enemy-b: rgba(66, 22, 16, 0.66);
    --line: rgba(255, 255, 255, 0.16);
    --text: #eef6ff;
    --muted: #9fb6cc;
    --warm: #ffd88a;
    --frozen: #8edfff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font: 14px/1.35 "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text);
    padding: 18px 6px 6px;
    display: flex;
    flex-direction: column;
  }
  .panel {
    max-height: 100%;
    overflow-y: auto;
    flex: 0 0 auto;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: linear-gradient(160deg, var(--my-a), var(--my-b));
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.42);
    backdrop-filter: blur(2px);
  }
  .panel > * { flex-shrink: 0; }
  .panel[data-side="enemy"] { background: linear-gradient(160deg, var(--enemy-a), var(--enemy-b)); }
  .panel[data-side="my"], .panel[data-side="enemy"] { user-select: none; -webkit-user-select: none; }
  .panel input, .panel textarea { user-select: text; -webkit-user-select: text; }
  .panel img { -webkit-user-drag: none; }
  .panel[data-side="enemy"] { scrollbar-width: none; }
  .panel[data-side="enemy"]::-webkit-scrollbar { display: none; }
  .panel[data-side="enemy"] .skill-query-list { max-height: none; overflow: visible; }

  .head { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; align-items: center; position: relative; }
  .avatar {
    width: 46px; height: 46px; border-radius: 9px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--line);
    object-fit: cover;
  }
  .name-row { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .name { font-size: 16px; font-weight: 900; letter-spacing: 0.5px; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; }
  .lv { color: var(--muted); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .types { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .physical-info { display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 3px; font-size: 12px; color: var(--muted); }
  .physical-medal { margin-left: 4px; color: var(--warm); font-weight: 700; }
  .type-chip {
    padding: 1px 6px; border-radius: 999px; font-size: 12px; font-weight: 800;
    background: rgba(255, 255, 255, 0.14); border: 1px solid var(--line);
  }

  .hp { margin-top: 2px; }
  .hp-track { position: relative; height: 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.45); overflow: hidden; }
  .hp-frozen-fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #d8fbff, var(--frozen)); border-right: 1px solid #e6fcff; transition: width 120ms linear; }
  .hp-frozen { color: var(--frozen); }
  .hp-track.unknown { background: repeating-linear-gradient(120deg, rgba(160,175,190,.2) 0 5px, rgba(160,175,190,.08) 5px 10px); }
  .hp-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #6ee7a8, #34d399); transition: width 120ms linear; }
  .hp-fill.warn { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .hp-fill.danger { background: linear-gradient(90deg, #fb7185, #e11d48); }
  .hp-text { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-top: 3px; font-size: 13px; color: var(--muted); }
  .hp-text b { color: var(--text); font-size: 14px; margin-left: auto; }
  .hp-text .hp-pct { font-style: normal; font-weight: 900; font-size: 14px; color: var(--warm); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
  .stats.stats-radar { display: block; padding: 0; background: none; }
  .radar { display: block; width: 100%; height: auto; }
  .radar-empty { font-size: 13px; color: var(--muted); padding: 8px 0; text-align: center; }
  .radar-note { font-size: 11px; color: var(--muted); text-align: center; margin-top: -2px; }
  .dmg-note { font-size: 10.5px; line-height: 1.35; color: var(--muted); opacity: 0.85; margin-top: 2px; }
  .stat {
    display: flex; justify-content: space-between; gap: 4px;
    padding: 2px 5px; border-radius: 5px;
    background: rgba(255, 255, 255, 0.07); font-size: 13px;
  }
  .stat span:first-child { color: var(--muted); }
  .stat span:last-child { font-weight: 800; }

  .buffs { display: flex; flex-wrap: wrap; gap: 3px; min-height: 18px; }
  .buff {
    padding: 1px 5px; border-radius: 999px; font-size: 12px; font-weight: 800;
    background: rgba(255, 255, 255, 0.12); border: 1px solid var(--line);
  }
  .buff.up { color: #a7f3d0; border-color: rgba(110, 231, 168, 0.5); }
  .buff.down { color: #fecaca; border-color: rgba(248, 113, 113, 0.5); }
  .buff.passive { color: var(--muted); border-color: rgba(255, 255, 255, 0.18); }

  .skills { flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; }
  .skill {
    display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 18px; gap: 4px; align-items: center;
    padding: 4px 6px; border-radius: 7px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .skill-icon { width: 34px; height: 34px; border-radius: 7px; object-fit: cover; background: rgba(0, 0, 0, 0.35); }
  .skill-main { min-width: 0; }
  .skill-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skill-tag { font-size: 11px; font-weight: 700; padding: 0 3px; margin-left: 4px; border-radius: 3px;
               border: 1px solid var(--line); vertical-align: middle; }
  .skill-tag.feature { color: #9fe0a7; border-color: rgba(159, 224, 167, 0.45); }
  .skill-tag.observed { color: #9fc4e0; border-color: rgba(159, 196, 224, 0.45); }
  .skill-meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skill-dmg { font-size: 13px; font-weight: 900; color: var(--warm); white-space: nowrap; text-align: right; }
  .ohko { margin-left: 4px; font-weight: 900; color: #ff4545; }
  .skill.empty { opacity: 0.4; grid-template-columns: minmax(0, 1fr); }
  .skill.empty .skill-name { color: var(--muted); font-weight: 700; }

  /* 萌化：精灵退化到上一阶，名字和种资质都变了，必须让玩家一眼看到为什么。 */
  .tag-cute { font-size: 11px; font-weight: 800; padding: 0 4px; margin-left: 4px; border-radius: 3px;
              color: #f0c2e0; border: 1px solid rgba(240, 194, 224, 0.5);
              background: rgba(240, 194, 224, 0.12); vertical-align: middle; }
  .tag-stage { font-size: 11px; font-weight: 700; padding: 0 4px; margin-left: 4px; border-radius: 3px;
               color: var(--muted); border: 1px solid var(--line); vertical-align: middle; }
  .tag-nature { font-size: 12px; font-weight: 700; color: #cdd6f4; vertical-align: middle; }
  .tag-speciality { font-size: 12px; font-weight: 700; color: #f7df98; margin-left: 8px; vertical-align: middle; }
  .buff.cute { color: #f0c2e0; border-color: rgba(240, 194, 224, 0.5);
               background: rgba(240, 194, 224, 0.12); }
  .buff.more { color: var(--muted); }

  .bench { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 4px; min-height: 26px; }
  .bench-pet { min-width: 0; text-align: center; display: flex; flex-direction: column; }
  .bench-pet img { order: 1; align-self: center; }
  .bench-pet .hp-track { order: 2; height: 5px; margin-top: 2px; }
  .bench-energy { order: 4; margin-top: 3px; padding: 1px 2px; border-radius: 4px; background: #243d50; font-size: 11px; }
  .bench-hp { order: 3; font-size: 11px; color: var(--text); }
  .active-energy { color: var(--warm); font-size: 13px; text-align: right; }
  .active-summary { display: flex; align-items: baseline; gap: 8px; }
  .active-summary .active-energy { margin-left: auto; white-space: nowrap; }
  .trait-damage { flex: 1; min-width: 0; color: var(--warm); font-size: 13px; line-height: 1.4; }
  .target-toggle { width: 18px; padding: 2px 0; border: 1px solid var(--line); border-radius: 4px; color: var(--warm); background: transparent; cursor: pointer; font: inherit; }
  .counter-toggle { padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--warm); background: transparent; cursor: pointer; font: inherit; }
  .target-panel { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 4px; }
  .target-panel select { width: 100%; color: var(--text); background: #284252; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  .target-result { color: var(--warm); text-align: right; }
  .wish-line { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; white-space: nowrap; }
  .wish-line span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .wish-line b { flex-shrink: 0; color: var(--warm); }
  .wish-scenarios { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 13px; }
  .wish-scenarios td, .wish-scenarios th { padding: 1px 2px; text-align: right; }
  .wish-scenarios td:first-child { text-align: left; }
  .wish-scenarios th { color: var(--muted); font-weight: 400; }
  .bench img { width: 26px; height: 26px; border-radius: 6px; object-fit: cover;
               border: 1px solid var(--line); opacity: 0.9; }
  .bench .none { font-size: 12px; color: var(--muted); align-self: center; }

  .stale { position: absolute; left: 8px; right: 8px; bottom: 4px; font-size: 12px;
           color: #fbbf24; text-align: center; }
  .offline { margin: auto; padding: 18px 14px; text-align: center; color: var(--muted); line-height: 1.45; }
  .offline .hint { display: inline-block; margin-top: 6px; font-size: 13px; opacity: 0.85; }
  .skill-query { border-top: 1px solid var(--line); padding-top: 6px; }
  .skill-query summary { cursor: pointer; color: var(--warm); }
  .skill-query input { width: 100%; margin: 6px 0; padding: 5px; border: 1px solid var(--line);
    border-radius: 5px; color: var(--text); background: rgba(0,0,0,.2); font: inherit; }
  .skill-query-list { max-height: 240px; overflow-y: auto; }
  .pool-skill { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .pool-skill p { margin: 2px 0; font-size: 12px; overflow-wrap: anywhere; }
  .pool-select { color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font: inherit; cursor: pointer; }
  .pool-select[aria-pressed="true"] { color: var(--warm); border-color: var(--warm); }
  .pool-source { color: var(--muted); font-size: 11px; }
  .panel[data-side="history"] { flex: 1; background: rgba(22,42,40,.8); gap: 2px; }
  .history-head { position: sticky; top: 0; background: #213c38; padding: 3px; color: var(--warm); }
  .history-line { padding: 3px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .history-my { color: #a7d9ff; } .history-enemy { color: #ffbfab; }
  .history-damage { color: var(--warm); font-weight: 800; }
</style>
</head>
<body>
<div class="panel" id="panel" data-side="my">
  <div class="offline" id="offline">等待对局数据…</div>
</div>
<script>
(function () {
  "use strict";
  var requestedSide = new URLSearchParams(location.search).get("side");
  var side = requestedSide === "history" ? "history" : requestedSide === "enemy" ? "enemy" : "my";
  var panel = document.getElementById("panel");
  // 战斗模式：pvp / world。PVP 不触发暴击，所以只在 world 下才把暴击值摆出来。
  var battleMode = "pvp";
  panel.dataset.side = side;
  var lastAt = 0;
  var lastKey = "";
  var diag = null;   // /api/live/battle 的 state：抓包健康度，用来解释"为什么没数据"
  var snapshotAge = 0;
  var cachedSnapshot = null;
  var skillPoolCache = {}, skillPoolRequests = {}, skillPoolQueries = {};
  var poolPreview = null;
  var targetQueries = {}, targetSession = '';
  var historyKey = '';
  var historySession = '';
  var worldStarError = '';

  // 没数据时分三种情况说清楚，而不是一律"等待对局数据…"：
  //   1) 中继没跑 → 让用户去启抓包
  //   2) 抓到了包但 key_hits=0 → 会话密钥没拿到，必须重新建连（最常见）
  //   3) 一切正常只是还没进对局
  function offlineText() {
    if (diag && diag.fetch_error) return '工作台连接暂缓，正在重试…';
    if (!diag) return "等待对局数据…<br><span class=\"hint\">（还没连上本地服务）</span>";
    if (!diag.relay_ok) {
      return "中继没在运行<br><span class=\"hint\">请在 APP 中点击“启动抓包”</span>";
    }
    var cap = diag.capture || {};
    if (diag.key_missing) {
      return "抓到了 " + (cap.target_packets || 0) + " 个包，但没拿到本次会话密钥<br>" +
        '<span class="hint">（key_hits=0，业务帧一条都解不开）<br>' +
        "0x1002 密钥只在客户端建连时发一次。<br>" +
        "请在游戏里退回登录界面重新进入，<br>或重启游戏客户端；密钥到手后会自动开始解码。</span>";
    }
    return "等待对局数据…<br><span class=\"hint\">已抓到 " + (cap.target_packets || 0) +
      " 个包 / 解出 " + (cap.parsed_business_records || 0) + " 条业务记录<br>" +
      "进对局后这里会自动填上</span>";
  }

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"]/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
    });
  }

  function pickTeam(snapshot) {
    var runtime = snapshot.runtime || {};
    var state = snapshot.state || {};
    var team = (side === "my") ? (runtime.myTeam || state.myTeam)
                              : (runtime.enemyTeam || state.enemyTeam);
    if ((!team || !team.length) && side === "enemy") {
      var preview = snapshot.enemyPreview || {};
      team = preview.enemyTeam || [];
    }
    return team || [];
  }

  function activeIndex(snapshot) {
    var runtime = snapshot.runtime || {};
    var state = snapshot.state || {};
    if (side === "my") {
      if (runtime.active && runtime.active.my) return runtime.active.my.rosterIndex || 0;
      return state.myActiveIndex || 0;
    }
    if (runtime.active && runtime.active.enemy) return runtime.active.enemy.rosterIndex || 0;
    return state.enemyActiveIndex || 0;
  }

  function iconUrl(entry) {
    var id = entry.stageBaseConfId || entry.petBaseId || entry.iconId || entry.id;
    if (!id) return "";
    return "/roco-pet-avatars-id/" + encodeURIComponent(id) + ".png";
  }

  function skillIconUrl(move) {
    var id = move.skill_id || move.skillId || move.id;
    if (!id) return "";
    if (/^\d+$/.test(String(id)) && Number(id) > 9999999) id = Math.floor(Number(id) / 100);
    return "/roco-skill-icons/" + encodeURIComponent(id) + ".png";
  }

  window.rocoImageError = function (img) {
    var tries = Number(img.dataset.retry || 0);
    if (tries >= 2 || !img.getAttribute('src')) { img.style.visibility = 'hidden'; return; }
    img.dataset.retry = tries + 1;
    var original = img.getAttribute('src').split('?')[0];
    setTimeout(function () { if (img.isConnected) img.src = original + '?retry=' + (tries + 1); }, tries ? 2000 : 500);
  };

  function hpOf(entry, snapshot) {
    var runtime = snapshot.runtime || {};
    var hp = runtime.hp && runtime.hp[side];
    var current = entry.currentHp == null ? NaN : Number(entry.currentHp);
    if (!isFinite(current) && hp && hp.hpAfter != null && isFinite(hp.hpAfter)) current = Number(hp.hpAfter);
    var max = Number(entry.maxHp) || Number(entry.stats && entry.stats.hp) || 0;
    var percent = entry.hpPercent == null ? NaN : Number(entry.hpPercent);
    if (!isFinite(percent) && max > 0 && isFinite(current)) percent = Math.round(current * 100 / max);
    if (!isFinite(percent)) percent = hp && hp.percent != null && isFinite(hp.percent) ? Number(hp.percent) : NaN;
    if (isFinite(percent)) percent = Math.max(current > 0 ? 1 : 0, Math.min(100, percent));
    var frozen = entry.frozenHp == null ? 0 : Number(entry.frozenHp);
    if (!isFinite(frozen) || frozen < 0) frozen = 0;
    var frozenPercent = max > 0 && isFinite(max) && current !== 0 ? Math.max(0, Math.min(100, frozen * 100 / max)) : 0;
    return { current: current, max: max, percent: percent, frozen: frozen, frozenPercent: frozenPercent };
  }

  function hpClass(percent) {
    if (percent <= 25) return "hp-fill danger";
    if (percent <= 55) return "hp-fill warn";
    return "hp-fill";
  }

  var STAT_KEYS = { "生命": "hp", "物攻": "phyAtk", "魔攻": "magAtk",
                    "物防": "phyDef", "魔防": "magDef", "速度": "spd" };
  var NATURE_LABEL = { patk: "物攻", pdef: "物防", matk: "魔攻", mdef: "魔防", spd: "速度", hp: "生命" };

  function statCells(entry) {
    // 捕获面板的状态层数另算；伤害候选不冒充已下发的真实面板。
    var live = entry.battleStats || {};
    var stats = entry.stats || {};
    var est = entry.battleStatsEstimated || {};
    var mon = entry.monster || {};
    var rows = [
      ["生命", live.hp || stats.hp || mon.base_hp],
      ["物攻", live.phyAtk || stats.phyAtk || stats.atk || mon.base_atk],
      ["魔攻", live.magAtk || stats.magAtk || stats.spAtk || mon.base_sp_atk],
      ["物防", live.phyDef || stats.phyDef || stats.def || mon.base_def],
      ["魔防", live.magDef || stats.magDef || stats.spDef || mon.base_sp_def],
      ["速度", live.spd || stats.spd || stats.speed || mon.base_spd]
    ];
    return rows.map(function (row) {
      var key = STAT_KEYS[row[0]];
      var estimated = key && est[key];
      var value = (row[1] == null || row[1] === "") ? "--" : row[1];
      if (estimated) value = "~" + value;
      var title = estimated
        ? ' title="对方报文没下发这一项，由实测伤害反解（误差约 ±1）"'
        : "";
      return '<div class="stat"' + title + '><span>' + esc(row[0]) + '</span><span>' + esc(value) + '</span></div>';
    }).join("");
  }

  // 六维雷达图：照洛克王国背包里精灵详情那种六边形刻度。
  // 数值用**含性格、不含战斗内 buff** 的 naturedStats（后端以进场面板 ×1.1/×0.9 算出）；
  // 性格增益/减益用 ↑↓ 标在对应轴上；个体值已知时用黄色标注（+10 就是满值）。
  var RADAR_AXES = [
    { key: "hp",     label: "生命", cap: 600, angle: -90 },
    { key: "phyAtk", label: "物攻", cap: 300, angle: 210 },
    { key: "phyDef", label: "物防", cap: 300, angle: 150 },
    { key: "magAtk", label: "魔攻", cap: 300, angle: -30 },
    { key: "magDef", label: "魔防", cap: 300, angle: 30 },
    { key: "spd",    label: "速度", cap: 250, angle: 90 }
  ];
  // 报文里的增减方向用短名（patk/pdef/...），雷达轴用长名。
  var NATURE_TO_STAT = { patk: "phyAtk", pdef: "phyDef", matk: "magAtk",
                         mdef: "magDef", spd: "spd", hp: "hp" };

  function radarChart(entry) {
    // naturedStats = 含性格、不含战斗内 buff；没有就退回裸面板 initialStats。
    var initial = entry.naturedStats || entry.initialStats || entry.stats || {};
    var live = entry.battleStats || {};
    var est = entry.battleStatsEstimated || {};
    var info = entry.configurationInference || {};
    var selection = info.protocol_selection || entry.talent_selection;
    var selected = selection && selection.selected ? selection.selected : null;
    if (!selected && info.known_talents) selected = Object.keys(info.known_talents).filter(function (d) { return info.known_talents[d] && info.known_talents[d].selected; });
    selected = selected || [];
    var shortKey = { hp:'hp', phyAtk:'patk', magAtk:'matk', phyDef:'pdef', magDef:'mdef', spd:'spd' };
    var knownNature = info.known_nature || {};
    var upKey = NATURE_TO_STAT[entry.natureUp || knownNature.up] || null;
    var downKey = NATURE_TO_STAT[entry.natureDown || knownNature.down] || null;

    var values = {}, ranges = {};
    var hasAny = false;
    RADAR_AXES.forEach(function (ax) {
      var v = initial[ax.key];
      if (ax.key === "hp" && !(typeof v === "number" && v > 0)) v = live.hp;
      var range = (info.panel_ranges || {})[ax.key] || (entry.naturedStatsRange || {})[ax.key];
      if (!range && !(typeof v === "number" && v > 0)) range = (entry.panelStatRanges || {})[ax.key];
      if (Array.isArray(range) && range.length === 2 && range[0] > 0 && range[1] >= range[0]) {
        ranges[ax.key] = range; v = range[1];
      }

      (physicalBits.length ? '<div class="physical-info">' + physicalBits.join('') + '</div>' : '') +
      '<div class="hp">' +
        '<div class="hp-track' + (isFinite(hp.percent) ? '' : ' unknown') + '"><div class="' + hpClass(hp.percent) + '" style="width:' + (isFinite(hp.percent) ? hp.percent : 0) + '%"></div>' +
          (hp.frozenPercent > 0 ? '<div class="hp-frozen-fill" style="width:' + hp.frozenPercent + '%" role="img" aria-label="冻结生命 ' + hp.frozen + '" title="冻结生命 ' + hp.frozen + '"></div>' : '') + '</div>' +
        '<div class="hp-text"><span>' + (side === "my" ? "我方场上" : "敌方场上") + "</span>" +
          "<b>" + (isFinite(hp.current) ? hp.current : "?") +
            (hp.frozen > 0 ? '<span class="hp-frozen">（' + hp.frozen + '）</span>' : '') + " / " + (hp.max || "?") + "</b>" +
          // 敌方在游戏里只能看到百分比，血量数字是抓包算出来的，两个都给，
          // 但百分比单独标出来，免得和游戏里对不上时看不出哪个是估算。
          (side === "enemy"
            ? '<em class="hp-pct">' + (isFinite(hp.percent) ? hp.percent : "?") + "%</em>"
            : "") +
          "</div>" +
      "</div>" +
      (worldStarError ? '<div class="dmg-note" role="status">' + esc(worldStarError) + '</div>' : '') +
      '<div class="stats stats-radar">' + radarChart(entry) + "</div>" +
      '<div class="buffs">' + buffChips(entry) + "</div>" +
      '<div class="active-summary">' + traitDamageRow(entry) +
      '<div class="active-energy">能量 <b>' + esc(entry.energy == null ? '?' : entry.energy) + ' / ' + esc(entry.maxEnergy == null ? '?' : entry.maxEnergy) + '</b></div></div>' +
      '<div class="skills">' + skillRows(entry) + "</div>" +
      extraDamageRows(entry) +
      '<div class="dmg-note">当前状态伤害估计</div>' +
      benchRow(team, index) + (side === 'enemy' ? skillPoolRows(entry) : '');
    panel.dataset.inferenceView = viewKey;
    var starSelect = panel.querySelectorAll('[data-world-stars]')[0];
    if (starSelect) starSelect.addEventListener('change', async function() {
      var runtime = (cachedSnapshot || {}).runtime || {};
      starSelect.disabled = true;
      try {
        var response = await fetch('/api/hud/world-stars', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
          sessionId:runtime.sessionId, snapshotToken:runtime.snapshotToken, petId:entry.petId,
          stars:starSelect.value === '' ? null : Number(starSelect.value)})});
        var result = await response.json();
        if (!response.ok) throw Error(result.error || '星级设置失败');
        worldStarError = '';
      } catch(error) {
        worldStarError = error.message;
        render(cachedSnapshot);
      }
    });
    panel.querySelectorAll('[data-target-toggle]').forEach(function(button) {
      button.addEventListener('click', function() {
        var key = button.dataset.targetToggle, query = targetQueries[key] || (targetQueries[key] = {});
        query.open = !query.open;
        render(cachedSnapshot);
      });
    });
    panel.querySelectorAll('[data-target-select]').forEach(function(select) {
      select.addEventListener('change', function() {
        previewTarget(select.dataset.targetSelect, {skillId:Number(select.dataset.skillId),slot:Number(select.dataset.slot)}, select.value);
      });
    });
    panel.querySelectorAll('[data-counter-toggle]').forEach(function(button) {
      button.addEventListener('click', function() {
        var query = targetQueries[button.dataset.counterToggle];
        if (query && query.open) { query.open = false; render(cachedSnapshot); }
        else previewListening({skillId:Number(button.dataset.skillId),slot:Number(button.dataset.slot)}, null);
      });
    });
    panel.querySelectorAll('[data-counter-select]').forEach(function(select) {
      select.addEventListener('change', function() {
        previewListening({skillId:Number(select.dataset.skillId),slot:Number(select.dataset.slot)}, select.value);
      });
    });
    panel.querySelectorAll('details[data-inference-key]').forEach(function (d) { d.open = openKeys.indexOf(d.dataset.inferenceKey) >= 0; });
    panel.querySelectorAll('details[data-skill-query]').forEach(function (d) {
      var form = d.dataset.skillQuery, input = d.querySelector('input');
      d.addEventListener('click', function (event) {
        var button = event.target.closest('[data-pool-skill]');
        if (button && d.contains(button)) return previewPoolSkill(Number(button.dataset.poolSkill), button.dataset.skillName, form);
      });
      d.querySelector('summary').addEventListener('click', function () {
        if (!d.open && skillPoolCache[form] && skillPoolCache[form].error) delete skillPoolCache[form];
      });
      d.addEventListener('toggle', function () { if (d.open && !skillPoolCache[form]) loadSkillPool(form); });
      input.addEventListener('input', function () {
        skillPoolQueries[form] = input.value;
        d.querySelector('.skill-query-list').innerHTML = poolResults(skillPoolCache[form], input.value);
      });
      if (d.open && !skillPoolCache[form]) loadSkillPool(form);
      if (searchFocused === form) { input.focus(); if (searchPosition != null) input.setSelectionRange(searchPosition, searchPosition); }
    });
    panel.scrollTop = scroll;
  }

  var pollPending = false;
  function poll() {
    if (pollPending) return;
    pollPending = true;
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 1500);
    return fetch("/api/hud/snapshot" + (lastAt ? '?after=' + encodeURIComponent(lastAt) : ''), { cache: "no-store", signal: controller.signal }).then(function (response) {
      if (!response || !response.ok) throw Error('工作台状态请求失败');
      return response.json();
    }).then(function (data) {
      if (!data) return;
      diag = data.state || diag;
      var payload = data.unchanged ? cachedSnapshot : data.payload || null;
      cachedSnapshot = payload;
      snapshotAge = Math.max(0, Math.floor(data.age_seconds || 0));
      var key = String(data.at || 0) + "|" + side + "|" + (diag ? (diag.key_missing + ":" + diag.relay_ok) : "") + (diag && !diag.relay_ok ? ":" + snapshotAge : "") + (!payload && diag ? ':' + diag.events_seen : '');
      var at = data.at || 0;
      if (key === lastKey && at === lastAt) return;
      lastKey = key;
      lastAt = at;
      render(payload);
    }).catch(function () {
      diag = Object.assign({}, diag || {}, { fetch_error: '工作台请求暂缓，正在重试' });
      lastKey = '';
      snapshotAge = lastAt ? Math.max(0, Math.floor(Date.now() / 1000 - lastAt)) : 0;
      render(cachedSnapshot);
    }).finally(function () { clearTimeout(timer); pollPending = false; });
  }

  poll();
  setInterval(poll, 300);
  // 工作台在同一浏览器里写 localStorage 时也能立刻刷新（网页版调试用）。
  window.addEventListener("storage", poll);

  // 面板是常驻窗口，改一次前端就得手动关掉重开很烦。这里盯着页面文件的修订号，
  // 后端一换代码就自己重载（只重载页面，不动窗口位置）。
  var pageRev = null;
  function watchRevision() {
    fetch("/api/hud/revision", { cache: "no-store" }).then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (data) {
      var rev = data && data.revision;
      if (!rev) return;
      if (pageRev === null) { pageRev = rev; return; }
      if (rev !== pageRev) { pageRev = rev; location.reload(); }
    }).catch(function () {});
  }
  watchRevision();
  setInterval(watchRevision, 5000);
})();
</script>
</body>
</html>
